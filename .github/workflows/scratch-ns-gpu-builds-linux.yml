name: scratch ns gpu builds linux

# Scratch (never merge): builds the GPUI app and the engine verify suites for
# main and for pull requests merged into their base, for the desktop harness
# and the verify suites on rented NVIDIA and AMD Linux machines.

on:
  push:
    branches: [scratch/ns-gpu-builds-linux]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CAP_VERIFY_CARGO_PROFILE: ci-verify
  CAP_VERIFY_NEXTEST_PROFILE: ci
  CAP_VERIFY_LOCKED: "1"

jobs:
  linux:
    name: linux ${{ matrix.ref }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ["2854", "2807", "2838"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.ref == 'main' && 'main' || format('refs/pull/{0}/merge', matrix.ref) }}
      - uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui
      - name: Verify suites
        uses: ./.github/actions/engine-verify-setup
        with:
          target: x86_64-unknown-linux-gnu
          tier: full
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out/bin"
          git rev-parse HEAD > "$out/sha.txt"
          scripts/verify/run.sh full --archive "$out/verify.tar.zst"
          cp apps/desktop-gpui/target/debug/cap-gpui "$out/bin/"
          cp "$(command -v cargo-nextest)" "$out/bin/"
          cp -r target/native-deps "$out/native-deps"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.ref }}
          path: ${{ runner.temp }}/pack
          retention-days: 3
          compression-level: 1
