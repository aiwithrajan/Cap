name: scratch ns gnome screenshot crash probe

on:
  push:
    branches: [scratch/ns-gnome-crash]

permissions:
  contents: read

env:
  CAP_DEB_URL: https://cdn.crabnebula.app/asset/01M5CHFS77QM2HSZ69KT784SAV
  CAP_DEB_SHA256: bb03dddc5268f64d3e6eb4c11534462e5b7a8a5c1c7bb5bca5f5bdaa99d11c56

jobs:
  probe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui
      - run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/cap.deb" "$CAP_DEB_URL"
          echo "$CAP_DEB_SHA256  $RUNNER_TEMP/cap.deb" | sha256sum --check
      - name: Loop the GNOME screenshot scenario, layer on and off, under gdb
        env:
          DEV_BIN: ${{ github.workspace }}/apps/desktop-gpui/target/debug/cap-gpui
          DEV_LIBS: ${{ github.workspace }}/target/native-deps/lib
          SCENARIO: screenshot
        run: |
          set +e
          for i in $(seq 10); do
            for variant in layer nolayer; do
              out="$RUNNER_TEMP/out/$variant-$i"
              extra=()
              [[ $variant == nolayer ]] && extra=(VK_LOADER_LAYERS_DISABLE=VK_LAYER_MESA_device_select)
              sudo -E bash scripts/linux-desktop-harness/run-desktop.sh gnome "$RUNNER_TEMP/cap.deb" \
                "$out" LAUNCH=dock GNOME_UNSAFE=1 CAP_GDB=1 "${extra[@]}" >/dev/null 2>&1
              alive=$(grep -o "cap_alive=.*" "$out/result.txt" 2>/dev/null)
              stop=$(grep -c GDBSTOP "$out/cap.log" 2>/dev/null)
              echo "$variant $i $alive gdbstop=$stop $(grep -o 'screenshot_taken=.*' "$out/result.txt" 2>/dev/null)" | tee -a "$RUNNER_TEMP/out/summary.txt"
              if [[ $stop -gt 0 ]]; then
                sed -E 's/\x1b\[[0-9;]*m//g' "$out/cap.log" | grep -A80 "received signal" | head -120
              fi
            done
          done
          echo ======; cat "$RUNNER_TEMP/out/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-crash-probe
          path: ${{ runner.temp }}/out
          retention-days: 3
