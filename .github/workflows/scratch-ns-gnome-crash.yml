name: scratch ns gnome screenshot crash probe

on:
  push:
    branches: [scratch/ns-gnome-crash]

permissions:
  contents: read

env:
  CAP_DEB_URL: https://cdn.crabnebula.app/asset/01M5CHFS77QM2HSZ69KT784SAV
  CAP_DEB_SHA256: bb03dddc5268f64d3e6eb4c11534462e5b7a8a5c1c7bb5bca5f5bdaa99d11c56

jobs:
  probe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-desktop-deps
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-unknown-linux-gnu
          prefix-key: v1-rust-gpui
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      - run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --bin cap-gpui
      - run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/cap.deb" "$CAP_DEB_URL"
          echo "$CAP_DEB_SHA256  $RUNNER_TEMP/cap.deb" | sha256sum --check
      - name: Loop the GNOME screenshot and export scenarios, layer on and off, with core dumps
        env:
          DEV_BIN: ${{ github.workspace }}/apps/desktop-gpui/target/debug/cap-gpui
          DEV_LIBS: ${{ github.workspace }}/target/native-deps/lib
        run: |
          set +e
          sudo sysctl -w kernel.core_pattern='/out/core.%e.%p'
          sudo sysctl -w fs.suid_dumpable=2
          summary="$RUNNER_TEMP/summary.txt"
          for i in $(seq 8); do
            for variant in layer nolayer; do
              for scenario in screenshot export; do
                out="$RUNNER_TEMP/out/$variant-$scenario-$i"
                extra=()
                [[ $variant == nolayer ]] && extra=(VK_LOADER_LAYERS_DISABLE=VK_LAYER_MESA_device_select)
                name=$(SCENARIO=$scenario KEEP_CONTAINER=1 sudo -E bash scripts/linux-desktop-harness/run-desktop.sh gnome "$RUNNER_TEMP/cap.deb" \
                  "$out" LAUNCH=dock GNOME_UNSAFE=1 "${extra[@]}" 2>/dev/null | sed -n 's/^kept container //p')
                crash=$(grep -h "native crash" "$out"/profile/logs/cap-gpui.log.crashes 2>/dev/null | head -1)
                core=$(ls "$out"/core.* 2>/dev/null | head -1)
                echo "$variant $scenario $i crash=[${crash}] core=${core:+yes}" | tee -a "$summary"
                if [[ -n $core && -n $name ]]; then
                  sudo docker exec "$name" gdb -q -batch -ex "set pagination off" -ex "bt 40" -ex "info sharedlibrary" \
                    /dev-bin/cap-gpui "/out/$(basename "$core")" 2>&1 | grep -vE "^\[New LWP|^warning:" | head -90 | tee "$out/backtrace.txt"
                fi
                [[ -n $name ]] && sudo docker rm -f "$name" >/dev/null 2>&1
              done
            done
          done
          echo =====; cat "$summary"
          echo "layer crashes: $(grep -c '^layer .*native crash' "$summary") of $(grep -c '^layer ' "$summary")"
          echo "nolayer crashes: $(grep -c '^nolayer .*native crash' "$summary") of $(grep -c '^nolayer ' "$summary")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-crash-probe
          path: |
            ${{ runner.temp }}/summary.txt
            ${{ runner.temp }}/out/*/backtrace.txt
            ${{ runner.temp }}/out/*/profile/logs/*
          retention-days: 3
